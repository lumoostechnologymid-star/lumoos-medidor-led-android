name: LumoosMedidor
options:
  bundleIdPrefix: com.lumoos
  deploymentTarget:
    iOS: '16.0'
packages:
  MedidorCore:
    path: .
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '0.2.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  LumoosMedidor:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: MedidorCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumoos.medidorled.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lumoos Medidor
        INFOPLIST_KEY_NSCameraUsageDescription: La cámara detecta los pulsos del LED o los cambios del cuadro del display para medir su duración.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_STYLE: Automatic
schemes:
  LumoosMedidor:
    build:
      targets:
        LumoosMedidor: all
